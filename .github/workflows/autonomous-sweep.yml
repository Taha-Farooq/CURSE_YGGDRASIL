name: Autonomous Sweep

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  autonomous:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run autonomous one-shot cycle
        shell: pwsh
        run: ./scripts/run-autonomous.ps1 -Once -Strict

